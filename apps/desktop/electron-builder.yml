appId: com.johanvelez.wolfcoredev
productName: WolfCore Dev
directories:
  output: release
  buildResources: resources
files:
  - out/**
# El hilo de trabajo de la auditoría de contraseñas carga bcryptjs por su ruta absoluta desde un
# `Worker` con `eval`: fuera del .asar para que la ruta sea la de un archivo real.
asarUnpack:
  - node_modules/bcryptjs/**
# El proceso principal va empaquetado por electron-vite y no usa módulos nativos. Sin esto,
# electron-builder intenta compilar dtrace-provider (opcional de bunyan, vía ftp-srv) y exige
# Visual Studio en el equipo que arma el instalador.
npmRebuild: false
# El icono de ventana y bandeja se lee en tiempo de ejecución desde process.resourcesPath.
extraResources:
  - from: resources/icono.png
    to: icono.png
  - from: resources/icono.ico
    to: icono.ico
  - from: resources/icono-bandeja.png
    to: icono-bandeja.png
win:
  target: nsis
  icon: resources/icono.ico
nsis:
  installerIcon: resources/icono.ico
  uninstallerIcon: resources/icono.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
