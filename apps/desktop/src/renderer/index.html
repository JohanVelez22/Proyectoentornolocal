<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!--
      connect-src admite ws:/wss: solo para el cliente WebSocket de Herramientas, que conecta a la
      URL que escribe el usuario (validada como ws:// o wss://). http(s) sigue limitado a 'self'.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WolfCore Dev</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
