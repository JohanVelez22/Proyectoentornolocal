name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Prueba de humo sobre la app EMPAQUETADA (electron-builder --dir: sin instalador ni firma): arranca
  # con una carpeta de datos nueva y recorre las vistas principales. Falla si la ventana queda en
  # blanco, si una vista sale vacía o si hay errores o avisos (CSP incluidos) en la consola. El CI
  # normal no lo veía: el build ocultaba un renderer que en `npm run dev` salía en blanco.
  humo:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compilar (electron-vite + CLI)
        run: npm run build -w @pel/desktop
      - name: Prueba de humo sobre out/ (Linux, con pantalla virtual)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run humo -w @pel/desktop -- --out
      - name: Prueba de humo sobre out/
        if: runner.os != 'Linux'
        run: npm run humo -w @pel/desktop -- --out
      - name: Empaquetar (sin instalador)
        if: always()
        run: npm run dist:dir -w @pel/desktop
      - name: Prueba de humo del empaquetado (Linux, con pantalla virtual)
        if: runner.os == 'Linux' && always()
        run: xvfb-run -a npm run humo -w @pel/desktop
      - name: Prueba de humo del empaquetado
        if: runner.os != 'Linux' && always()
        run: npm run humo -w @pel/desktop
