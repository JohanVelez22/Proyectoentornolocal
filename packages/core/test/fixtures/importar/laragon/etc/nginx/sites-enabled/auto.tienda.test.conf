# Laragon auto virtual host
server {
    listen 80;
    server_name tienda.test *.tienda.test;
    root "@RAIZ@/www/tienda/public";
    index index.php;
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ \.php$ {
        fastcgi_pass php_upstream;
        root "C:/otra/cosa";
    }
}
