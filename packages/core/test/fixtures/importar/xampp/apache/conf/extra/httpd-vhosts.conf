# Virtual Hosts de XAMPP
Define RAIZ "@RAIZ@"

<VirtualHost *:80>
    ServerAdmin admin@example.com
    DocumentRoot "${RAIZ}/htdocs"
    ServerName localhost
</VirtualHost>

<VirtualHost *:80>
    ServerName miapp.local
    DocumentRoot "${RAIZ}/htdocs/miapp"
</VirtualHost>

<VirtualHost *:80>
    ServerName fuera.local
    DocumentRoot "C:/Windows/System32"
</VirtualHost>

<VirtualHost *:80>
    ServerName red.local
    DocumentRoot "//servidor/recurso/web"
</VirtualHost>

<VirtualHost *:80>
    ServerName fantasma.local
    DocumentRoot "${RAIZ}/htdocs/no-existe"
</VirtualHost>
